# .gitlab-ci.yml — Unified SpecPress CI pipeline.
#
# Jobs:
#
#   finalize-cr  — Runs first, on pushes to "main" or "Rel-*" branches only
#                  (enforced via rules:). Renames CRxxxx.json to CR####.json
#                  (zero-padded CR number) and pushes the commit back to the
#                  branch. Requires CI_PUSH_TOKEN to be set in CI/CD variables.
#
#   export       — Runs on every push to any branch, after finalize-cr.
#                  On main/Rel-* branches this means it sees the renamed
#                  CR####.json (no CRxxxx.json), so it produces a normal DOCX
#                  and HTML export instead of a DIFF.
#                  On feature branches it generates a DOCX DIFF and HTML DIFF
#                  if CRxxxx.json exists, otherwise a normal DOCX and HTML export.
#                  Artifacts (DOCX + self-contained HTML) are retained for 30 days.
#
#   validate-cr  — Runs on merge requests targeting "main" or "Rel-*" branches.
#                  Blocks the merge if CR metadata is missing, invalid, or
#                  conflicts with an existing CR number.
#
#                  If USE_MR_IID_AS_CR_NUMBER is "true" (default), the CR field
#                  in CRxxxx.json must equal the MR IID. Since MR IIDs are
#                  GitLab-assigned and unique per project, and each spec maps
#                  to one project, this replaces the external CR number
#                  assignment service. The author sets the CR number once
#                  after the MR is created.
#                  If "false", the CR number only has to be present and must
#                  not collide with an existing CR####.json in the history
#                  folder.
#
#   notify-mr    — Runs after a successful export on branch pushes. Posts a
#                  comment with links to the HTML, DOCX and ZIP artifacts to the
#                  branch's open merge request. Requires CI_NOTE_TOKEN
#                  (see the variables section below); skipped with a warning
#                  if unset.
#
#   release      — Runs when a version tag (e.g. 20.3.0) is pushed. Creates a
#                  GitLab Release with direct download links for the HTML and
#                  DOCX artifacts on the Releases page.
#
# Copy this file to the top level of your specification repository and rename
# it to ".gitlab-ci.yml". Configure the variables below as needed.

# Run pipelines on push events and on merge request events (for validate-cr).
# Using workflow:rules ensures both pipeline types are created independently,
# so a push to a branch with an open MR triggers both a branch pipeline
# (for export) and an MR pipeline (for validate-cr) rather than only one.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

variables:
  # path to the specification root folder, relative to repo root:
  SPEC_ROOT: "specification"

  # specification number (e.g., "38.413"):
  SPEC_NUMBER: "TR 38.xxx"

  # path to front page meta data in JSON format (optional):
  FRONT_PAGE_DATA: "specification/assets/specFrontPage.json"

  # username for CI push (finalize-cr job). Default value should be OK!
  CI_PUSH_USER: "oauth2"

  # CI_PUSH_TOKEN is required for finalize-cr.
  #   To generate: Settings > Access Tokens > Add new token,
  #     select scope "write_repository", copy the value.
  #   Then store it via Settings > CI/CD > Variables > CI/CD Variables > Add variable
  #     paste the key into the value field
  #     set Key=CI_PUSH_TOKEN, and
  #     enable "Masked and hidden" and "Protected".

  # CI_NOTE_TOKEN is required for notify-mr (optional: without it no MR comment
  # with links to the exported artifacts is posted). CI_JOB_TOKEN cannot be used
  # because it is not permitted to read merge requests or to create MR notes.
  #   To generate: Settings > Access Tokens > Add new token,
  #     enter a descriptive token name such as "SpecPress notifier" (it is shown as the
  #     author name of the MR comments, so do not name it after the variable),
  #     select role "Reporter" (or higher) and scope "api", copy the value.
  #   Then store it via Settings > CI/CD > Variables > CI/CD Variables > Add variable
  #     paste the key into the value field
  #     set Key=CI_NOTE_TOKEN, and
  #     enable "Masked and hidden".
  #   The comments are authored by the token's bot user.

  # If "true", validate-cr requires the "CR" field in CRxxxx.json to equal the
  # merge request IID. MR IIDs are unique per project, so this replaces an
  # external CR number assignment service (suitable when each specification
  # lives in its own project).
  # If "false", validate-cr only checks that a CR number is present in
  # CRxxxx.json and that no CR####.json with that number already exists in the
  # history folder (on the source or target branch).
  USE_MR_IID_AS_CR_NUMBER: "false"

  # Pattern (ERE) that TDoc numbers in CRxxxx.json must match.
  # Override per project to restrict to a specific working group or allow
  # non-standard patterns (e.g. "^6GSM-[0-9]{6}$" for 6GSM documents).
  # The default covers standard 3GPP TDoc formats (RP-/SP-/R1..R6-/C1..C6-/S1..S6-).
  TDOC_PATTERN: '^[CSR][P1-6]-[0-9]{6,7}$'

  # If "true", the TDoc number from CRxxxx.json is only rendered on the CR cover
  # page of the DOCX/HTML DIFF exports when a git tag equal to that TDoc number
  # points at the pushed commit. This prevents the artifacts of every commit on
  # a CR branch from carrying the TDoc number before the CR has been tagged.
  # If "false", the TDoc number is always shown on the CR cover page.
  REQUIRE_TDOC_NUMBER_TAG: "true"

  # Repository and branch from which the CI pipeline shall download the
  # specpress library for rendering HTML- and DOCX versions upon commits.
  # Default values should be OK!
  SPECPRESS_REPO: "https://github.com/Ericsson/specpress.git"
  SPECPRESS_REF: "main"

  # Docker image for the export job. The default node:20 image does not
  # include Msc-generator. To enable MSC-Gen diagram rendering in CI, build a
  # custom image that includes msc-gen and set this variable to its registry path.
  # See ci_templates/Dockerfile.specpress for an example.
  DOCX_IMAGE: "node:20"

stages:
  - finalize
  - build
  - validate
  - deploy

# -----------------------------------------------------------------------------
# finalize-cr: rename CRxxxx.json → CR####.json after merge
#
# Runs only on pushes to main or Rel-* branches (enforced via rules:).
# Must run before export-docx so the DOCX export sees CR####.json, not
# CRxxxx.json, and produces a normal export rather than a DOCX DIFF.
# -----------------------------------------------------------------------------
finalize-cr:
  stage: finalize
  image: alpine:latest
  before_script:
    - |
      if [ -z "$CI_PUSH_TOKEN" ]; then
        echo "ERROR: CI_PUSH_TOKEN is not set. Set it in Settings > CI/CD > Variables."
        exit 1
      fi
      if [ -z "$CI_PUSH_USER" ]; then
        echo "ERROR: CI_PUSH_USER is not set. Set it in Settings > CI/CD > Variables."
        exit 1
      fi
    - apk add --no-cache git jq
  script:
    - |
      CR_FILE="${SPEC_ROOT}/history/CRxxxx.json"

      if [ ! -f "$CR_FILE" ]; then
        echo "No $CR_FILE found — nothing to finalize."
        exit 0
      fi

      CR_NUMBER=$(jq -r '.CR // empty' "$CR_FILE")
      if [ -z "$CR_NUMBER" ]; then
        echo "ERROR: $CR_FILE has no CR field — cannot rename."
        exit 1
      fi

      CR_PADDED=$(printf "CR%04d" "$CR_NUMBER")
      TARGET_FILE="${SPEC_ROOT}/history/${CR_PADDED}.json"

      if [ -f "$TARGET_FILE" ]; then
        echo "ERROR: $TARGET_FILE already exists — CR number conflict."
        exit 1
      fi

      echo "Renaming $CR_FILE → $TARGET_FILE"
      git mv "$CR_FILE" "$TARGET_FILE"

      git config user.email "ci@specpress"
      git config user.name "SpecPress CI"
      git commit -m "Finalize ${CR_PADDED}: rename CRxxxx.json → ${CR_PADDED}.json"

      REMOTE_URL=$(echo "$CI_PROJECT_URL.git" | sed "s|https://|https://${CI_PUSH_USER}:${CI_PUSH_TOKEN}@|")
      git push "$REMOTE_URL" HEAD:"$CI_COMMIT_REF_NAME"

      echo "✓ ${CR_PADDED}.json committed and pushed."
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME =~ /^Rel-\d+$/

# -----------------------------------------------------------------------------
# export: build DOCX and HTML on every push
#
# On CR branches (CRxxxx.json exists): generates a DOCX DIFF and an HTML DIFF
# against the merge-base of the target release branch.
# On regular branches: generates a plain DOCX and plain HTML export.
#
# Artifacts include output/export.docx and the self-contained output/export.html
# (images are embedded as BASE64).
# -----------------------------------------------------------------------------
export:
  stage: build
  image: $DOCX_IMAGE
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libreoffice-writer python3-uno chromium msc-generator jq
    - export CHROME_BIN=$(which chromium)
    - export MSCGEN_BIN=$(which msc-gen 2>/dev/null || echo "")
  script:
    - git clone --depth 1 --branch $SPECPRESS_REF $SPECPRESS_REPO /tmp/specpress
    - cd /tmp/specpress && npm ci --omit=dev && cd -
    - mkdir -p output
    - COMMIT_DATE=$(git show -s --format=%ci HEAD | awk '{print $1"_"$2}' | tr ':' '-')
    - SHORT_SHA=$(git rev-parse --short HEAD)
    - BRANCH_NAME=$(echo $CI_COMMIT_REF_NAME | tr '/' '_')
    - |
      CR_FILE="${SPEC_ROOT}/history/CRxxxx.json"
      if [ -f "$CR_FILE" ]; then
        echo "=== CR branch detected (${CR_FILE} exists) ==="

        RELEASE=$(jq -r '.Release // empty' "$CR_FILE" 2>/dev/null)
        if [ -n "$RELEASE" ]; then
          TARGET_BRANCH="Rel-${RELEASE}"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Using release branch: ${TARGET_BRANCH}"
          else
            echo "Branch ${TARGET_BRANCH} not found, falling back to main"
            TARGET_BRANCH="main"
          fi
        else
          echo "No Release field in CRxxxx.json, using main"
          TARGET_BRANCH="main"
        fi

        git fetch origin "$TARGET_BRANCH" --unshallow 2>/dev/null || git fetch origin "$TARGET_BRANCH"
        BASE_COMMIT=$(git merge-base HEAD "origin/$TARGET_BRANCH")
        echo "Target branch: ${TARGET_BRANCH}, Merge-base: ${BASE_COMMIT}"

        DOCX_LABEL="${COMMIT_DATE}_${SPEC_NUMBER}_DIFF_${BRANCH_NAME}_${SHORT_SHA}.docx"
        HTML_LABEL="${COMMIT_DATE}_${SPEC_NUMBER}_DIFF_${BRANCH_NAME}_${SHORT_SHA}.html"

        echo "--- Generating DOCX DIFF ---"
        TDOC_NUMBER=$(jq -r '."TDoc Number" // empty' "$CR_FILE" 2>/dev/null)
        SHOW_TDOC=""
        if [ -n "$TDOC_NUMBER" ]; then
          if [ "$REQUIRE_TDOC_NUMBER_TAG" != "true" ]; then
            echo "REQUIRE_TDOC_NUMBER_TAG is not \"true\" — TDoc number will be shown"
            SHOW_TDOC="--show-tdoc-number"
          elif git tag --points-at HEAD | grep -qxF "$TDOC_NUMBER"; then
            echo "Tag $TDOC_NUMBER matches current commit — TDoc number will be shown"
            SHOW_TDOC="--show-tdoc-number"
          fi
        fi

        node /tmp/specpress/lib/cli/export-docx-diff.js \
          "$SPEC_ROOT" \
          --output "output/export.docx" \
          --base "$BASE_COMMIT" \
          --revisions HEAD \
          --backend libreoffice \
          --spec-root "$SPEC_ROOT" \
          --cr-cover-page-data "$CR_FILE" \
          $SHOW_TDOC

        echo "--- Generating HTML DIFF ---"
        node /tmp/specpress/lib/cli/export-html-diff.js \
          "$SPEC_ROOT" \
          --output "output/export.html" \
          --base "$BASE_COMMIT" \
          --revision HEAD \
          --spec-root "$SPEC_ROOT" \
          --cr-cover-page-data "$CR_FILE" \
          $SHOW_TDOC
      else
        echo "=== No CRxxxx.json found — normal export ==="

        DOCX_LABEL="${COMMIT_DATE}_${SPEC_NUMBER}_${BRANCH_NAME}_${SHORT_SHA}.docx"
        HTML_LABEL="${COMMIT_DATE}_${SPEC_NUMBER}_${BRANCH_NAME}_${SHORT_SHA}.html"

        echo "--- Generating DOCX ---"
        node /tmp/specpress/lib/cli/export-docx.js \
          "$SPEC_ROOT" \
          "output/export.docx" \
          --spec-root "$SPEC_ROOT" \
          ${FRONT_PAGE_DATA:+--front-page-data "$FRONT_PAGE_DATA"}

        echo "--- Generating HTML ---"
        node /tmp/specpress/lib/cli/export-html.js \
          "$SPEC_ROOT" \
          "output/export.html" \
          --spec-root "$SPEC_ROOT" \
          ${FRONT_PAGE_DATA:+--front-page-data "$FRONT_PAGE_DATA"}
      fi

      echo "DOCX: output/export.docx ($DOCX_LABEL)"
      echo "HTML: output/export.html ($HTML_LABEL)"
    - echo "EXPORT_JOB_ID=${CI_JOB_ID}" > export.env
  artifacts:
    paths:
      - output/export.docx
      - output/export.html
    reports:
      # Hands the job ID to notify-mr so that it can build artifact URLs.
      dotenv: export.env
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# -----------------------------------------------------------------------------
# notify-mr: post a comment with links to the exported artifacts on the MR
#
# Runs after a successful export on branch pushes. If an open merge request
# exists for the pushed branch, a new comment is added to the MR's Activity
# section with links to the HTML, the DOCX and a ZIP of both. The files are
# downloaded, not rendered in the browser: GitLab does not display
# artifact HTML inline unless GitLab Pages is configured for that. Because a new
# comment is posted per push, it appears in the timeline right after the
# "added N commits" entry.
#
# Requires CI_NOTE_TOKEN; see the variables section at the top of this file for
# how to create and configure it.
# If CI_NOTE_TOKEN is not set, the job logs a warning and does nothing.
# The job is allowed to fail so that a notification problem never blocks a
# pipeline; failures show up as a warning on the pipeline.
#
# Limitation: if the MR is created after the last push, no comment exists until
# the next push.
# -----------------------------------------------------------------------------
notify-mr:
  stage: deploy
  image: alpine:latest
  needs: [export]
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "$CI_NOTE_TOKEN" ]; then
        echo "WARNING: CI_NOTE_TOKEN is not set — skipping MR comment."
        exit 0
      fi

      curl --silent --fail --get \
        --header "PRIVATE-TOKEN: ${CI_NOTE_TOKEN}" \
        --data-urlencode "source_branch=${CI_COMMIT_REF_NAME}" \
        --data-urlencode "state=opened" \
        --output /tmp/mrs.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" || {
        echo "ERROR: could not query merge requests (check CI_NOTE_TOKEN scope/role)."
        exit 1
      }
      MR_IID=$(jq -r '.[0].iid // empty' /tmp/mrs.json)
      if [ -z "$MR_IID" ]; then
        echo "No open merge request for branch ${CI_COMMIT_REF_NAME} — nothing to do."
        exit 0
      fi

      BASE="${CI_PROJECT_URL}/-/jobs/${EXPORT_JOB_ID}/artifacts"
      BODY="📄 Export for commit \`${CI_COMMIT_SHORT_SHA}\` (${CI_COMMIT_TITLE}): [HTML (download)](${BASE}/file/output/export.html) · [DOCX (download)](${BASE}/raw/output/export.docx) · [ZIP (HTML + DOCX)](${BASE}/download)"

      HTTP_CODE=$(curl --silent --output /tmp/response.json --write-out '%{http_code}' \
        --request POST \
        --header "PRIVATE-TOKEN: ${CI_NOTE_TOKEN}" \
        --data-urlencode "body=${BODY}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/notes")
      if [ "$HTTP_CODE" != "201" ]; then
        echo "ERROR: posting comment to MR !${MR_IID} failed (HTTP ${HTTP_CODE}):"
        cat /tmp/response.json
        exit 1
      fi
      echo "✓ Comment posted to MR !${MR_IID}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# release: create a GitLab Release with direct HTML and DOCX links
#
# Runs only when a version tag (e.g. 20.3.0) is pushed to main or a Rel-*
# branch. Attaches the exported HTML and DOCX as named asset links on the
# GitLab Releases page, accessible without downloading a zip.
# -----------------------------------------------------------------------------
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [export]
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Exported specification $CI_COMMIT_TAG"
    assets:
      links:
        - name: "$SPEC_NUMBER $CI_COMMIT_TAG (HTML)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/output/export.html?job=export"
        - name: "$SPEC_NUMBER $CI_COMMIT_TAG (DOCX)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/output/export.docx?job=export"
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

# -----------------------------------------------------------------------------
# validate-cr: block MRs with invalid CR metadata
#
# NOTE: For this job to block merging, enable "Pipelines must succeed" in
#       Settings > Merge requests > Merge checks in your GitLab project.
#
# This job exits with code 1 (pipeline failure) for all validation errors,
# including work-in-progress states such as a missing CR number. This is
# intentional: the MR should not be mergeable until all checks pass.
#
# Validation results are also written as a JUnit XML report (cr-validation.xml).
# GitLab renders this in the MR "Tests" tab, showing each check by name and
# surfacing failure messages directly on the MR page — no log diving needed.
#
# If you do not want to receive GitLab failure emails for these expected
# failures, adjust your notification preferences:
#   Profile > Notifications > [project] > Custom > uncheck "Failed pipeline"
# -----------------------------------------------------------------------------
validate-cr:
  stage: validate
  image: node:20
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git jq
    - git clone --depth 1 --branch $SPECPRESS_REF $SPECPRESS_REPO /tmp/specpress
    - cd /tmp/specpress && npm ci --omit=dev && cd -
  script:
    - |
      CR_FILE="${SPEC_ROOT}/history/CRxxxx.json"
      HISTORY_DIR="${SPEC_ROOT}/history"
      TARGET="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      JUNIT="cr-validation.xml"
      FAILED=0

      # Helpers to accumulate JUnit test cases
      JUNIT_CASES=""
      pass() { JUNIT_CASES="${JUNIT_CASES}<testcase classname=\"CR Validation\" name=\"$1\"/>"; }
      fail() {
        MSG=$(echo "$2" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
        JUNIT_CASES="${JUNIT_CASES}<testcase classname=\"CR Validation\" name=\"$1\"><failure message=\"${MSG}\">${MSG}</failure></testcase>"
        FAILED=1
      }
      write_junit() {
        echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" > "$JUNIT"
        echo "<testsuites><testsuite name=\"CR Validation\">" >> "$JUNIT"
        echo "$JUNIT_CASES" >> "$JUNIT"
        echo "</testsuite></testsuites>" >> "$JUNIT"
      }

      # --- (a) CRxxxx.json must exist ---
      if [ ! -f "$CR_FILE" ]; then
        fail "CRxxxx.json exists" "$CR_FILE not found. A CR metadata file is required before merging."
        write_junit
        echo "ERROR: $CR_FILE not found. A CR metadata file is required before merging."
        exit 1
      fi
      pass "CRxxxx.json exists"
      echo "✓ $CR_FILE exists"

      # --- (b) CRxxxx.json must match the schema ---
      VALIDATION=$(node -e "
        const { loadCRCoverPageData } = require('/tmp/specpress/lib/common/crCoverPageLoader');
        const path = require('path');
        const result = loadCRCoverPageData(path.resolve('$CR_FILE'));
        if (!result.valid) {
          console.log('ERRORS:' + result.errors.join('; '));
          process.exit(1);
        }
      " 2>&1) || {
        SCHEMA_ERRORS=$(echo "$VALIDATION" | grep "^ERRORS:" | sed 's/^ERRORS://')
        fail "Schema validation" "$CR_FILE does not match the schema:${SCHEMA_ERRORS}"
        write_junit
        echo "ERROR: $CR_FILE does not match the schema."
        echo "$SCHEMA_ERRORS" | sed 's/^/  /'
        exit 1
      }
      pass "Schema validation"
      echo "✓ Schema validation passed"

      # --- (c) CR number must be present; if USE_MR_IID_AS_CR_NUMBER is "true",
      #         it must also equal the MR IID ---
      CR_NUMBER=$(jq -r '.CR // empty' "$CR_FILE")
      if [ "$USE_MR_IID_AS_CR_NUMBER" = "true" ]; then
        if [ -z "$CR_NUMBER" ]; then
          fail "CR number matches MR IID" "CR field is empty. Set \"CR\": ${CI_MERGE_REQUEST_IID} in $CR_FILE."
          write_junit
          echo "ERROR: CR field is empty. Set \"CR\": ${CI_MERGE_REQUEST_IID} in $CR_FILE."
          exit 1
        fi
        if [ "$CR_NUMBER" != "$CI_MERGE_REQUEST_IID" ]; then
          fail "CR number matches MR IID" "CR field ($CR_NUMBER) does not match MR IID (${CI_MERGE_REQUEST_IID}). Set \"CR\": ${CI_MERGE_REQUEST_IID} in $CR_FILE."
          write_junit
          echo "ERROR: CR field ($CR_NUMBER) does not match MR IID (${CI_MERGE_REQUEST_IID})."
          exit 1
        fi
        pass "CR number matches MR IID"
        echo "✓ CR number matches MR IID: $CR_NUMBER"
      else
        if [ -z "$CR_NUMBER" ]; then
          fail "CR number present" "CR field is empty. Set a CR number in $CR_FILE."
          write_junit
          echo "ERROR: CR field is empty. Set a CR number in $CR_FILE."
          exit 1
        fi
        pass "CR number present"
        echo "✓ CR number present: $CR_NUMBER (MR IID match not enforced)"
      fi

      # --- (d) TDoc Number must match TDOC_PATTERN ---
      # Presence of the TDoc Number is already guaranteed by the schema
      # validation in (b), which reports a missing TDoc Number as an error.
      TDOC_NUMBER=$(jq -r '."TDoc Number" // empty' "$CR_FILE")
      if echo "$TDOC_NUMBER" | grep -qE "$TDOC_PATTERN"; then
        pass "TDoc Number format"
        echo "✓ TDoc Number matches pattern: $TDOC_NUMBER"
      else
        fail "TDoc Number format" "TDoc Number '$TDOC_NUMBER' does not match required pattern '$TDOC_PATTERN'."
        write_junit
        echo "ERROR: TDoc Number '$TDOC_NUMBER' does not match required pattern '$TDOC_PATTERN'."
        exit 1
      fi

      # --- (f) Release must match target branch (unless target is main) ---
      if [ "$TARGET" != "main" ]; then
        RELEASE=$(jq -r '.Release // empty' "$CR_FILE")
        EXPECTED_BRANCH="Rel-${RELEASE}"
        if [ "$EXPECTED_BRANCH" != "$TARGET" ]; then
          fail "Release matches target branch" "Release field (Rel-${RELEASE}) does not match target branch (${TARGET})."
          write_junit
          echo "ERROR: Release field (Rel-${RELEASE}) does not match target branch (${TARGET})."
          exit 1
        fi
        pass "Release matches target branch"
        echo "✓ Release matches target branch: $TARGET"
      else
        pass "Release matches target branch"
        echo "✓ Target is main — skipping Release check"
      fi

      # --- (g) CR####.json must not already exist (collision guard) ---
      CR_PADDED=$(printf "CR%04d" "$CR_NUMBER")
      FINAL_FILE="${HISTORY_DIR}/${CR_PADDED}.json"

      if [ -f "$FINAL_FILE" ]; then
        fail "CR number not already used" "$FINAL_FILE already exists on the source branch. CR number $CR_NUMBER is already used."
        write_junit
        echo "ERROR: $FINAL_FILE already exists on the source branch. CR number $CR_NUMBER is already used."
        exit 1
      fi

      # Make sure the target branch is available locally for the check below
      # (the runner's default fetch may not include it).
      git fetch --quiet origin "$TARGET" 2>/dev/null || true

      if git cat-file -e "origin/${TARGET}:${FINAL_FILE}" 2>/dev/null; then
        fail "CR number not already used" "$FINAL_FILE already exists on the target branch (${TARGET}). CR number $CR_NUMBER is already used."
        write_junit
        echo "ERROR: $FINAL_FILE already exists on the target branch (${TARGET}). CR number $CR_NUMBER is already used."
        exit 1
      fi
      pass "CR number not already used"
      echo "✓ ${CR_PADDED}.json does not exist on source or target branch"

      write_junit
      echo ""
      echo "=== All CR validation checks passed ==="
  artifacts:
    when: always
    reports:
      junit: cr-validation.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^Rel-\d+$/
